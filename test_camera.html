<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Camera Test — vbg</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #111; color: #eee; }
  video { width: 640px; max-width: 100%; border: 2px solid #444; border-radius: 8px; background: #000; }
  pre { background: #222; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
  button, select { font-size: 16px; padding: 8px 14px; border-radius: 8px; border: 0; }
  button { background: #3b82f6; color: white; cursor: pointer; }
</style>
</head>
<body>
<h1>vbg — Camera Test</h1>
<p>Make sure <code>python run.py</code> is running, then pick a camera and click Start.</p>
<p>
  <select id="sel"></select>
  <button onclick="start()">Start camera</button>
</p>
<video id="v" autoplay muted playsinline></video>
<pre id="out">Ready.</pre>
<script>
const sel = document.getElementById('sel');
const out = document.getElementById('out');
const v = document.getElementById('v');

async function listCams() {
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    const cams = devs.filter(d => d.kind === 'videoinput');
    sel.innerHTML = '';
    cams.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId;
      o.textContent = d.label || ('Camera ' + i);
      sel.appendChild(o);
    });
    out.textContent = 'Found ' + cams.length + ' camera(s). Pick one and click Start.';
  } catch (e) {
    out.textContent = 'enumerateDevices ERROR: ' + e.name + ': ' + e.message;
  }
}

async function start() {
  out.textContent = 'Starting camera...';
  try {
    const id = sel.value;
    const stream = await navigator.mediaDevices.getUserMedia({
      video: id ? { deviceId: { exact: id } } : true
    });
    v.srcObject = stream;
    const track = stream.getVideoTracks()[0];
    const s = track.getSettings();
    out.textContent = 'OK — camera: ' + track.label + '\n' + JSON.stringify(s, null, 2);
  } catch (e) {
    out.textContent = 'ERROR: ' + e.name + ': ' + e.message;
  }
}

listCams();
</script>
</body>
</html>
